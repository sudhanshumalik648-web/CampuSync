                                                    {templateAttachments.length > 0 ? (
                                                        <div className="template-attachment-pills">
                                                            {templateAttachments.map(att => (
                                                                <div 
                                                                    key={att.id} 
                                                                    className="template-file-pill" 
                                                                    onClick={() => handleDownloadFile(att)}
                                                                    title={`Click to view/download ${att.name}`}
                                                                    style={{ cursor: 'pointer' }}
                                                                >
                                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.45rem', overflow: 'hidden' }}>
                                                                        <span style={{ fontSize: '0.95rem' }}>{att.icon || '📄'}</span>
                                                                        <span style={{ fontWeight: 600, textOverflow: 'ellipsis', overflow: 'hidden', whiteSpace: 'nowrap' }}>
                                                                            {att.name}
                                                                        </span>
                                                                    </div>
                                                                    <span style={{ fontSize: '0.7rem', color: '#64748B', marginLeft: '0.5rem', whiteSpace: 'nowrap' }}>
                                                                        {att.size} ⬇️
                                                                    </span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    ) : (
                                                        <div style={{ fontSize: '0.75rem', color: '#94A3B8', fontStyle: 'italic', padding: '0.2rem 0' }}>
                                                            No specification documents attached. Click Edit to attach files.
                                                        </div>
                                                    )}
                                                </div>

                                                <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', marginTop: 'auto' }} onClick={() => onUseTemplate(template)} title="Start a new proposal with this template's pre-filled text and attached documents">
                                                    <span>✍️ Use Template</span>
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* ADD / EDIT TEMPLATE MODAL */}
                    {editingTemplate && (
                        <div className="modal-overlay" onClick={() => setEditingTemplate(null)}>
                            <div className="modal-content" style={{ maxWidth: '680px' }} onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h2 className="modal-title">{editingTemplate.isNew ? '+ Create Document Template' : '✏️ Edit Document Template'}</h2>
                                    <button className="modal-close-btn" onClick={() => setEditingTemplate(null)}>×</button>
                                </div>
                                <form onSubmit={handleFormSubmit} style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0, overflow: 'hidden' }}>
                                    <div className="modal-body" style={{ overflowY: 'auto', flex: 1, minHeight: 0 }}>
                                        <div className="form-group">
                                            <label className="form-label">Template Title *</label>
                                            <input type="text" className="form-input" placeholder="e.g. Laboratory Equipment Grant Proposal" value={formData.title} onChange={(e) => setFormData({ ...formData, title: e.target.value })} required />
                                        </div>
                                        <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '1rem' }}>
                                            <div className="form-group">
                                                <label className="form-label">Category</label>
                                                <select className="form-input" value={formData.category} onChange={(e) => setFormData({ ...formData, category: e.target.value })}>
                                                    {PRESET_CATEGORIES.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                                </select>
                                            </div>
                                            <div className="form-group">
                                                <label className="form-label">Icon / Emoji</label>
                                                <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center' }}>
                                                    <input type="text" className="form-input" style={{ textAlign: 'center', fontSize: '1.25rem', width: '60px' }} value={formData.icon} maxLength={4} onChange={(e) => setFormData({ ...formData, icon: e.target.value })} />
                                                    <div style={{ display: 'flex', gap: '0.25rem', flexWrap: 'wrap' }}>
                                                        {PRESET_ICONS.slice(0, 5).map(ico => (
                                                            <button key={ico} type="button" style={{ background: formData.icon === ico ? '#EFF6FF' : '#F1F5F9', border: '1px solid', borderColor: formData.icon === ico ? '#3B82F6' : '#CBD5E1', borderRadius: '6px', cursor: 'pointer', padding: '0.2rem 0.4rem', fontSize: '1rem' }} onClick={() => setFormData({ ...formData, icon: ico })}>{ico}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Template Overview / Guidance</label>
                                            <textarea className="form-textarea" rows="2" placeholder="Brief summary of who should use this template and what policy it complies with..." value={formData.description} onChange={(e) => setFormData({ ...formData, description: e.target.value })} />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Default Proposal Title Format</label>
                                            <input type="text" className="form-input" placeholder="e.g. Lab Safety Inspection: [Room / Building]" value={formData.draftTitle} onChange={(e) => setFormData({ ...formData, draftTitle: e.target.value })} />
                                            <small style={{ color: '#64748B', fontSize: '0.75rem' }}>This text will automatically populate the Proposal Title when a faculty member uses this template.</small>
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Default Proposal Content / Sections</label>
                                            <textarea className="form-textarea" rows="5" placeholder="Provide boilerplate sections, checklist items, or questions to prompt the faculty member..." value={formData.draftDescription} onChange={(e) => setFormData({ ...formData, draftDescription: e.target.value })} />
                                            <small style={{ color: '#64748B', fontSize: '0.75rem' }}>Boilerplate text and prompts that will automatically pre-fill into the proposal rationale.</small>
                                        </div>

                                        {/* ATTACHED DOCUMENTS & SPECIFICATIONS SECTION */}
                                        <div className="form-group" style={{ background: '#F8FAFC', padding: '1.25rem', borderRadius: '12px', border: '1px solid #E2E8F0' }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.35rem' }}>
                                                <label className="form-label" style={{ fontWeight: 700, margin: 0, display: 'flex', alignItems: 'center', gap: '0.4rem', color: '#0F172A' }}>
                                                    <span>📎 Attached Documents & Policy Specifications</span>
                                                </label>
                                                <span style={{ fontSize: '0.75rem', color: '#2563EB', background: '#EFF6FF', padding: '0.2rem 0.55rem', borderRadius: '12px', fontWeight: 600 }}>
                                                    {(formData.attachments || []).length} Files Attached
                                                </span>
                                            </div>
                                            <small style={{ color: '#64748B', fontSize: '0.78rem', display: 'block', marginBottom: '0.9rem' }}>
                                                Attach official university policy PDFs, syllabus rubrics, and financial spreadsheets. Faculty who use this template will have instant access to these files.
                                            </small>

                                            {/* Real File Input & Upload Dropzone */}
                                            <input 
                                                type="file" 
                                                ref={fileInputRef} 
                                                multiple 
                                                accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv" 
                                                style={{ display: 'none' }} 
                                                onChange={handleFileSelect}

                                            <div 
                                                className="template-upload-dropzone"
                                                onClick={() => fileInputRef.current && fileInputRef.current.click()}

                                                </span>

        // 11. CreateTaskModal Component
        function CreateTaskModal({ departments, columns, currentUser, onClose, onCreateTask, draftTemplate }) {
            const fileInputRef = React.useRef(null);
            const [title, setTitle] = React.useState(draftTemplate ? draftTemplate.draftTitle : '');
            const [description, setDescription] = React.useState(draftTemplate ? draftTemplate.draftDescription : '');
            const [columnId, setColumnId] = React.useState(1);
            const [targetDeptId, setTargetDeptId] = React.useState('');
            const [dueDate, setDueDate] = React.useState('2026-08-15');
            const [attachments, setAttachments] = React.useState(draftTemplate && draftTemplate.attachments ? [...draftTemplate.attachments] : []);

            const handleFileSelect = (e) => {
                const files = Array.from(e.target.files || []);
                if (files.length === 0) return;

                const newAtts = files.map(file => {
                    let icon = '📄';
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (['xls', 'xlsx', 'csv'].includes(ext)) icon = '📊';
                    else if (['doc', 'docx'].includes(ext)) icon = '📝';
                    else if (['ppt', 'pptx'].includes(ext)) icon = '📽️';
                    else if (['pdf'].includes(ext)) icon = '📕';

                    const sizeKB = Math.round(file.size / 1024);
                    const sizeStr = sizeKB > 1024 ? (sizeKB / 1024).toFixed(1) + ' MB' : sizeKB + ' KB';

                    let blobUrl = null;
                    try {
                        blobUrl = URL.createObjectURL(file);
                    } catch (err) {}

                    return {
                        id: 'task_att_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                        name: file.name,
                        size: sizeStr,
                        type: file.type || 'application/octet-stream',
                        icon: icon,
                        url: blobUrl
                    };
                });

                setAttachments(prev => [...prev, ...newAtts]);
                if (e.target) e.target.value = '';
            };

            const handleRemoveAttachment = (attId) => {
                setAttachments(prev => prev.filter(a => a.id !== attId));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!title.trim()) return;
                onCreateTask({
                    title: title.trim(),
                    description: description.trim(),
                    column_id: parseInt(columnId, 10),
                    target_department_id: targetDeptId ? parseInt(targetDeptId, 10) : null,
                    due_date: dueDate,
                    attachments: attachments
                });
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h2 className="modal-title">Propose New Academic Workflow Task</h2>
                            <button className="modal-close-btn" onClick={onClose}>×</button>
                        </div>
                        <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0, overflow: 'hidden' }}>
                            <div className="modal-body" style={{ overflowY: 'auto', flex: 1, minHeight: 0 }}>
                                <div className="form-group">
                                    <label className="form-label">Proposal Title *</label>
                                    <input type="text" className="form-input" placeholder="e.g. CS202 Advanced Algorithms Lab Modernization" value={title} onChange={(e) => setTitle(e.target.value)} required />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Detailed Proposal & Rationale</label>
                                    <textarea className="form-textarea" rows="4" placeholder="Provide background, resource requirements, and department sign-off details..." value={description} onChange={(e) => setDescription(e.target.value)} />
                                </div>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                                    <div className="form-group">
                                        <label className="form-label">Initial Workflow Column</label>
                                        <select className="form-select" value={columnId} onChange={(e) => setColumnId(e.target.value)}>
                                            {columns.map(col => (<option key={col.id} value={col.id}>{col.title}</option>))}
                                        </select>
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Target Completion Date</label>
                                        <input type="date" className="form-input" value={dueDate} onChange={(e) => setDueDate(e.target.value)} />
                                    </div>
                                </div>

                                {/* Attached Documentation & Specification Files */}
                                <div className="form-group" style={{ background: '#F8FAFC', padding: '1rem', borderRadius: '10px', border: '1px solid #E2E8F0' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.4rem' }}>
                                        <label className="form-label" style={{ fontWeight: 600, margin: 0 }}>
                                            📎 Attached Documentation & Specifications ({attachments.length})
                                        </label>
                                        <input 
                                            type="file" 
                                            ref={fileInputRef} 
                                            multiple 
                                            accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv" 
                                            style={{ display: 'none' }} 
                                            onChange={handleFileSelect} 
                                        />
                                        <button 
                                            type="button" 
                                            className="btn btn-secondary"
                                            style={{ fontSize: '0.75rem', padding: '0.25rem 0.6rem' }}
                                            onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        >
                                            + Attach PDF / Document
                                        </button>
                                    </div>
                                    <span style={{ fontSize: '0.75rem', color: '#64748B', display: 'block', marginBottom: '0.6rem' }}>
                                        Reference documents or specifications attached to this academic proposal.
                                    </span>

                                    {attachments.length > 0 ? (
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.45rem' }}>
                                            {attachments.map(att => (
                                                <div key={att.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#FFFFFF', padding: '0.45rem 0.75rem', borderRadius: '6px', border: '1px solid #CBD5E1', fontSize: '0.8rem' }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.45rem' }}>
                                                        <span>{att.icon || '📄'}</span>
                                                        <span style={{ fontWeight: 600, color: '#0F172A' }}>{att.name}</span>
                                                        <span style={{ color: '#64748B', fontSize: '0.72rem' }}>({att.size})</span>
                                                    </div>
                                                    <button 
                                                        type="button" 
                                                        onClick={() => handleRemoveAttachment(att.id)}
                                                        style={{ background: 'transparent', border: 'none', color: '#EF4444', cursor: 'pointer', fontSize: '0.8rem', fontWeight: 600 }}
                                                    >
                                                        ✕
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div style={{ fontSize: '0.75rem', color: '#94A3B8', fontStyle: 'italic' }}>
                                            No documents attached yet. Click "+ Attach PDF / Document" to upload guidelines or specs.
                                        </div>
                                    )}
                                </div>

                                <div className="form-group" style={{ background: '#F8FAFC', padding: '1rem', borderRadius: '10px', border: '1px solid #E2E8F0' }}>
                                    <label className="form-label" style={{ display: 'flex', alignItems: 'center', gap: '0.4rem' }}><span>🔒 Granular Access Routing (Optional Privacy Restriction)</span></label>
                                    <span style={{ fontSize: '0.75rem', color: '#64748B', marginBottom: '0.4rem' }}>By default, proposals are Public. Selecting a target department restricts visibility exclusively to that department, the creator, and Deans.</span>
                                    <select className="form-select" value={targetDeptId} onChange={(e) => setTargetDeptId(e.target.value)}>
                                        <option value="">🌐 Public (Visible to All Faculty & Departments)</option>
                                        {departments.map(d => (<option key={d.id} value={d.id}>🔒 Restrict Exclusively to {d.name} ({d.short_code})</option>))}
                                    </select>
                                </div>
                            </div>
                            <div className="modal-footer" style={{ flexShrink: 0, background: '#F8FAFC', borderTop: '1px solid #E2E8F0', padding: '1rem 1.75rem', display: 'flex', justifyContent: 'flex-end', gap: '0.75rem' }}>
                                <button type="button" className="btn btn-outline" onClick={onClose}>Cancel</button>
                                <button type="submit" className="btn btn-primary" style={{ display: 'inline-flex', alignItems: 'center', gap: '0.45rem', fontWeight: 700 }}>
                                    <span>🚀 Submit Proposal (Send for Review)</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // 13. AuthView Component (Faculty Portal Login & Registration Landing View)
        function AuthView({ users = [], departments = [], onLogin, onRegister, onResetDemo }) {
            const [activeTab, setActiveTab] = React.useState('roles'); // 'roles' | 'signin' | 'signup'
            
            // Sign-in state
            const [signInEmail, setSignInEmail] = React.useState('');
            const [signInPassword, setSignInPassword] = React.useState('');
            const [rememberMe, setRememberMe] = React.useState(true);

            // Sign-up state
            const [regName, setRegName] = React.useState('');
            const [regEmail, setRegEmail] = React.useState('');
            const [regRole, setRegRole] = React.useState('Professor');
            const [regDeptId, setRegDeptId] = React.useState(departments[0]?.id || 1);

            // Feedback state
            const [errorMsg, setErrorMsg] = React.useState('');
            const [successMsg, setSuccessMsg] = React.useState('');

            const handleRoleCardClick = (user) => {
                setErrorMsg('');
                setSuccessMsg(`Signing in as ${user.name} (${user.role})...`);
                setTimeout(() => {
                    onLogin(user);
                }, 300);
            };

            const handleSignInSubmit = (e) => {
                e.preventDefault();
                setErrorMsg('');

                const emailClean = signInEmail.trim().toLowerCase();
                if (!emailClean) {
                    setErrorMsg('Please enter your university email address.');
                    return;
                }

                const foundUser = users.find(u => u.email.toLowerCase() === emailClean);
                if (foundUser) {
                    setSuccessMsg(`Welcome back, ${foundUser.name}!`);
                    setTimeout(() => {
                        onLogin(foundUser);
                    }, 300);
                } else {

        // 14. Main CampusSync Application Root
        const API_BASE = '../backend';

        function CampusSyncApp() {
            const [activeView, setActiveView] = React.useState('home');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [departments, setDepartments] = React.useState(DUMMY_DEPARTMENTS);
            const [users, setUsers] = React.useState(DUMMY_USERS);
            const [columns, setColumns] = React.useState(DUMMY_COLUMNS);
            const [tasks, setTasks] = React.useState(DUMMY_TASKS);
            const [currentUser, setCurrentUser] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('campussync_auth_user');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.id) return parsed;
                    }
                } catch (e) {}
                return null; // Require login/sign in on entry!
            });
            const [activeModal, setActiveModal] = React.useState(null);
            const [selectedTask, setSelectedTask] = React.useState(null);
            const [taskComments, setTaskComments] = React.useState([]);
            const [draftTemplate, setDraftTemplate] = React.useState(null);
            const [activeDocument, setActiveDocument] = React.useState(null);
            const [activityLogs, setActivityLogs] = React.useState([]);
            const [draggedTask, setDraggedTask] = React.useState(null);
            const [dragOverColumnId, setDragOverColumnId] = React.useState(null);
            const [selectedTaskIds, setSelectedTaskIds] = React.useState([]);
            const [printDossierTasks, setPrintDossierTasks] = React.useState(null);

            const fetchBoardData = React.useCallback(async (userContext = currentUser) => {
                try {
                    const headers = { 'X-User-Id': userContext ? userContext.id : 3 };
                    const tasksRes = await fetch(`${API_BASE}/tasks.php?board_id=1`, { headers });
                    if (tasksRes.ok) {
                        const tasksJson = await tasksRes.json();
                        if (tasksJson.success && Array.isArray(tasksJson.data)) setTasks(tasksJson.data);
                    }
                    const colsRes = await fetch(`${API_BASE}/columns.php?board_id=1`);
                    if (colsRes.ok) {
                        const colsJson = await colsRes.json();
                        if (colsJson.success && Array.isArray(colsJson.data)) setColumns(colsJson.data);
                    }
                    const deptsRes = await fetch(`${API_BASE}/departments.php`);
                    if (deptsRes.ok) {
                        const deptsJson = await deptsRes.json();
                        if (deptsJson.success && Array.isArray(deptsJson.data)) setDepartments(deptsJson.data);
                    }
                    const usersRes = await fetch(`${API_BASE}/users.php`);
                    if (usersRes.ok) {
                        const usersJson = await usersRes.json();
                        if (usersJson.success && Array.isArray(usersJson.data)) setUsers(usersJson.data);
                    }
                    // Global audit logs: Strictly restricted by backend to higher authorities
                    const logsRes = await fetch(`${API_BASE}/activity_logs.php`, { headers });
                    if (logsRes.ok) {
                        const logsJson = await logsRes.json();
                        if (logsJson.success && Array.isArray(logsJson.data)) {
                            setActivityLogs(logsJson.data);
                        } else {
                            setActivityLogs([]);
                        }
                    } else {
                        setActivityLogs([]);
                    }
                } catch (err) {
                    console.warn("Using offline fallback data");
                }
            }, [currentUser]);

            React.useEffect(() => {
                fetchBoardData();
                const pollInterval = setInterval(() => {
                    if (document.visibilityState === 'visible') fetchBoardData();
                }, 4000);
                return () => clearInterval(pollInterval);
            }, [fetchBoardData]);

            const handleLogin = (user) => {
                setCurrentUser(user);
                try {
                    localStorage.setItem('campussync_auth_user', JSON.stringify(user));
                } catch (e) {}
                fetchBoardData(user);
            };

            const handleRegister = async (newUserData) => {
                try {
                    const res = await fetch(`${API_BASE}/auth.php`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'register',
                            name: newUserData.name,
                            email: newUserData.email,
                            role: newUserData.role,
                            department_id: newUserData.department_id
                        })
                    });
                    if (res.ok) {
                        const json = await res.json();
                        if (json.success && json.user) {
                            setUsers(prev => [...prev, json.user]);
                            handleLogin(json.user);
                            return;
                        }
                    }
                } catch (err) {
                    console.warn("Using offline registration fallback");
                }
                setUsers(prev => [...prev, newUserData]);
                handleLogin(newUserData);
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setSelectedTaskIds([]);
                try {
                    localStorage.removeItem('campussync_auth_user');
                } catch (e) {}
            };

            const handleSelectUser = (newUser) => {
                setCurrentUser(newUser);
                try {
                    localStorage.setItem('campussync_auth_user', JSON.stringify(newUser));
                } catch (e) {}
                if (activeView === 'audit' && !isHigherAuthority(newUser)) {
                    setActiveView('home');
                }
                fetchBoardData(newUser);
            };

            // Multi-Selection Handlers for Batch Detailed Printing
            const handleToggleSelectTask = (taskId) => {
                setSelectedTaskIds(prev => 
                    prev.includes(taskId) ? prev.filter(id => id !== taskId) : [...prev, taskId]
                );
            };

            const handleSelectAllTasks = (taskIds) => {
                setSelectedTaskIds(taskIds);
            };

            const handleClearTaskSelection = () => {
                setSelectedTaskIds([]);
            };

            const handlePrintSelected = () => {
                const selected = tasks.filter(t => selectedTaskIds.includes(t.id));
                if (selected.length > 0) {
                    setPrintDossierTasks(selected);
                }
            };

            const handlePrintSingleTask = (task) => {
                setPrintDossierTasks([task]);
            };

            const filteredTasks = tasks.filter(t => {
                if (!searchQuery.trim()) return true;
                const q = searchQuery.toLowerCase();
                return (t.title && t.title.toLowerCase().includes(q)) || 
                       (t.description && t.description.toLowerCase().includes(q)) ||
                       (t.creator_name && t.creator_name.toLowerCase().includes(q));
            });

            const handleDragStart = (e, task) => {
                setDraggedTask(task);
                e.dataTransfer.setData('text/plain', task.id);
                e.dataTransfer.effectAllowed = 'move';
            };

            const handleDragOver = (e, columnId) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                if (dragOverColumnId !== columnId) setDragOverColumnId(columnId);
            };

            const handleDragLeave = () => setDragOverColumnId(null);

            const handleDrop = async (e, targetColumnId) => {
                e.preventDefault();
                setDragOverColumnId(null);
                if (!draggedTask || draggedTask.column_id === targetColumnId) return;

                const updatedTasks = tasks.map(t => {
                    if (t.id === draggedTask.id) {
                        return {
                            ...t,
                            column_id: targetColumnId,
                            last_moved_by_name: currentUser.name,
                            status: targetColumnId === 4 ? 'Finalized' : 
                                    targetColumnId === 3 ? 'Dean Approval' : 
                                    targetColumnId === 2 ? 'In Review' : 'Proposed'
                        };
                    }
                    return t;
                });
                setTasks(updatedTasks);

                try {
                    await fetch(`${API_BASE}/tasks.php`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-User-Id': currentUser.id },
                        body: JSON.stringify({ id: draggedTask.id, column_id: targetColumnId })
                    });
                    fetchBoardData();
                } catch (err) {}
            };

            const handleOpenTaskDetail = async (task) => {
                setSelectedTask(task);
                setActiveModal('detail');
                try {
                    const res = await fetch(`${API_BASE}/comments.php?task_id=${task.id}`, {
                        headers: { 'X-User-Id': currentUser.id }
                    });
                    if (res.ok) {
                        const json = await res.json();
                        if (json.success && Array.isArray(json.data)) {
                            setTaskComments(json.data);
                            return;
                        }
                    }
                } catch (err) {}
                setTaskComments(DUMMY_COMMENTS.filter(c => c.task_id === task.id));
            };

            const handleAddComment = async (taskId, text) => {
                try {
                    const res = await fetch(`${API_BASE}/comments.php`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-User-Id': currentUser.id },
                        body: JSON.stringify({ task_id: taskId, text })
                    });
                    if (res.ok) {
                        const json = await res.json();
                        if (json.success && json.data) {
                            setTaskComments(prev => [...prev, json.data]);
                            fetchBoardData();
                            return;
                        }
                    }
                } catch (err) {
                    const newComment = {
                        id: Date.now(),
                        task_id: taskId,
                        user_id: currentUser.id,
                        user_name: currentUser.name,
                        user_role: currentUser.role,
                        avatar_initials: currentUser.avatar_initials,
                        dept_code: currentUser.dept_code,
                        dept_color: currentUser.dept_color,
                        text,
                        timestamp: 'Just now'
                    };
                    setTaskComments(prev => [...prev, newComment]);
                }
            };

            const handleMoveTaskDetail = async (task, nextColumnId) => {
                await handleDrop({ preventDefault: () => {} }, nextColumnId);
                setActiveModal(null);
            };

            const handleDeleteTask = async (taskId) => {
                setTasks(prev => prev.filter(t => t.id !== taskId));
                setActiveModal(null);
                try {
                    await fetch(`${API_BASE}/tasks.php?id=${taskId}`, {
                        method: 'DELETE',
                        headers: { 'X-User-Id': currentUser.id }
                    });
                } catch (err) {}
            };

            const handleCreateTask = async (newProposal) => {
                try {
                    const res = await fetch(`${API_BASE}/tasks.php`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-User-Id': currentUser.id },
                        body: JSON.stringify(newProposal)
                    });
                    if (res.ok) {
                        const json = await res.json();
                        if (json.success) {
                            fetchBoardData();
                            setActiveModal(null);
                            setDraftTemplate(null);
                            return;
                        }
                    }
                } catch (err) {
                    const fallbackTask = {
                        id: Date.now(),
                        ...newProposal,
                        creator_id: currentUser.id,
                        creator_name: currentUser.name,
                        creator_role: currentUser.role,
                        creator_avatar: currentUser.avatar_initials,
                        creator_dept_code: currentUser.dept_code,
                        creator_dept_color: currentUser.dept_color,
                        status: 'Proposed',
                        last_moved_by_name: currentUser.name,
                        created_at: new Date().toISOString().slice(0, 19).replace('T', ' '),
                        comment_count: 0
                    };
                    setTasks(prev => [...prev, fallbackTask]);
                    setActiveModal(null);
                    setDraftTemplate(null);
                }
            };

            const handleResetDemo = async () => {
                try {
                    await fetch(`${API_BASE}/setup.php`);
                    fetchBoardData();
                    alert("Database campussync_db reset and re-seeded with initial Master Blueprint demo data!");
                } catch (err) {
                    alert("Demo reset complete.");
                }
            };

            if (!currentUser) {
                return (
                    <AuthView 
                        users={users}
                        departments={departments}
                        onLogin={handleLogin}
                        onRegister={handleRegister}
                        onResetDemo={handleResetDemo}
                    />
                );
            }

            return (
                <div className="app-layout">
                    <Sidebar activeView={activeView} onSelectView={setActiveView} currentUser={currentUser} onLogout={handleLogout} />

                    <div className="main-wrapper">
                        <Header 
                            activeView={activeView}
                            users={users}
                            currentUser={currentUser}
                            searchQuery={searchQuery}
                            onSearchChange={setSearchQuery}
                            onSelectUser={handleSelectUser}
                            onOpenCreateModal={() => setActiveModal('create')}
                            onPrintBoard={() => window.print()}
                            onResetDemo={handleResetDemo}
                            logs={activityLogs}
                            onLogout={handleLogout}
                        />

                        {activeView === 'home' && (
                            <HomeDashboard 
                                currentUser={currentUser}
                                tasks={filteredTasks}
                                logs={activityLogs}
                                onSelectView={setActiveView}
                                onOpenCreateModal={() => setActiveModal('create')}
                                onOpenTaskDetail={handleOpenTaskDetail}
                            />
                        )}

                        {activeView === 'board' && (
                            <KanbanBoard 
                                columns={columns}
                                tasks={filteredTasks}
                                onDragStart={handleDragStart}
                                onDragOver={handleDragOver}
                                onDragLeave={handleDragLeave}
                                onDrop={handleDrop}
                                onClickCard={handleOpenTaskDetail}
                                selectedTaskIds={selectedTaskIds}
                                onToggleSelect={handleToggleSelectTask}
                                onSelectAll={handleSelectAllTasks}
                                onClearSelection={handleClearTaskSelection}
                                onPrintSelected={handlePrintSelected}
                                onOpenDocument={(doc, task) => setActiveDocument({ doc, task })}
                            />
                        )}

                        {activeView === 'templates' && (
                            <TemplateLibraryView onUseTemplate={(template) => {
                                setDraftTemplate(template);
                                setActiveModal('create');
                            }} />
                        )}

                        {activeView === 'audit' && (
                            <AuditLogsView logs={activityLogs} onResetDemo={handleResetDemo} currentUser={currentUser} onSelectView={setActiveView} />
                        )}

                        {activeView === 'settings' && (
                            <SettingsView currentUser={currentUser} onResetDemo={handleResetDemo} onLogout={handleLogout} />
                        )}
                    </div>

                    {/* FLOATING ACTION BAR FOR SELECTED TASKS */}
                    {selectedTaskIds.length > 0 && (
                        <div className="selection-action-bar no-print">
                            <div className="selection-info">
                                <span style={{ fontSize: '1.1rem' }}>✓</span>
                                <span style={{ fontWeight: 600 }}>
                                    {selectedTaskIds.length} {selectedTaskIds.length === 1 ? 'proposal' : 'proposals'} selected
                                </span>
                            </div>

                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                                <button
                                    className="btn btn-primary"
                                    onClick={handlePrintSelected}
                                    style={{ 
                                        background: '#2563EB', 
                                        borderColor: '#3B82F6', 
                                        padding: '0.45rem 1rem',
                                        fontSize: '0.85rem'
                                    }}
                                    title="Print detailed view of only selected requests"
                                >
                                    <span>🖨️ Print Selected ({selectedTaskIds.length})</span>
                                </button>

                                <button
                                    className="btn btn-secondary"
                                    onClick={() => {
                                        if (selectedTaskIds.length === filteredTasks.length) {
                                            handleClearTaskSelection();
                                        } else {
                                            handleSelectAllTasks(filteredTasks.map(t => t.id));
                                        }
                                    }}
                                    style={{ 
                                        background: '#334155', 
                                        color: '#FFFFFF', 
                                        border: 'none', 
                                        padding: '0.45rem 0.9rem',
                                        fontSize: '0.85rem'
                                    }}
                                >
                                    <span>{selectedTaskIds.length === filteredTasks.length ? 'Deselect All' : 'Select All'}</span>
                                </button>

                                <button
                                    className="btn btn-secondary"
                                    onClick={handleClearTaskSelection}
                                    style={{ 
                                        background: 'transparent', 
                                        color: '#94A3B8', 
                                        border: '1px solid #475569', 
                                        padding: '0.45rem 0.75rem',
                                        fontSize: '0.85rem'
                                    }}
                                    title="Clear selection"
                                >
                                    <span>✕</span>
                                </button>
                            </div>
                        </div>
                    )}

                    {activeModal === 'detail' && selectedTask && (
                        <TaskDetailModal 
                            task={selectedTask}
                            comments={taskComments}
                            columns={columns}
                            currentUser={currentUser}
                            onClose={() => setActiveModal(null)}
                            onAddComment={handleAddComment}
                            onMoveTask={handleMoveTaskDetail}
                            onDeleteTask={handleDeleteTask}
                            onPrintDetailed={handlePrintSingleTask}
                            onOpenDocument={(doc, task) => setActiveDocument({ doc, task })}
                        />
                    )}

                    {activeModal === 'create' && (
                        <CreateTaskModal 
                            departments={departments}
                            columns={columns}
                            currentUser={currentUser}
                            draftTemplate={draftTemplate}
                            onClose={() => {
                                setActiveModal(null);
                                setDraftTemplate(null);
                            }}
                            onCreateTask={handleCreateTask}
                        />
                    )}

                    {/* DEDICATED PRINT DOSSIER PREVIEW & EXPORT MODAL */}
                    {printDossierTasks && (
                        <PrintDossierModal 
                            tasks={printDossierTasks}
                            allComments={taskComments.length > 0 ? taskComments : DUMMY_COMMENTS}
                            onClose={() => setPrintDossierTasks(null)}
                            onPrint={() => window.print()}
                        />
                    )}

                    {/* ACADEMIC SPECIFICATION DOCUMENT VIEWER & INSPECTOR MODAL */}
                    {activeDocument && (
                        <DocumentViewerModal 
                            doc={activeDocument.doc}
                            task={activeDocument.task}
                            onClose={() => setActiveDocument(null)}
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CampusSyncApp />);
    </script>
</body>
</html>
