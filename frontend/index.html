            { id: 3, task_id: 3, user_id: 6, user_name: "Clara Oswald", user_role: "Accounts", avatar_initials: "CO", dept_code: "ACC", dept_color: "#F59E0B", text: "Accounts has reviewed the cloud compute line items. Will need Dean approval once verified.", timestamp: "2026-07-23 15:45:00" },
            { id: 4, task_id: 4, user_id: 1, user_name: "Dean Elena Miller", user_role: "Dean", avatar_initials: "EM", dept_code: "DEAN", dept_color: "#EC4899", text: "Pending final review of the lab room allocation before formal approval.", timestamp: "2026-07-25 14:00:00" }
        ];

        // Helper to check for higher authority roles
        function isHigherAuthority(user) {
            if (!user || !user.role) return false;
            const role = user.role.toLowerCase().trim();
            const higherRoles = ['dean', 'director', 'admin', 'administrator', 'provost', 'chancellor', 'president'];
            return higherRoles.some(r => role.includes(r));
        }

        // 1. Sidebar Component (Matching Reference UI Screenshot)
        function Sidebar({ activeView, onSelectView, currentUser, onLogout }) {
            const navItems = [
                { id: 'home', label: 'Home', icon: '🏠', title: 'Mission Control Dashboard' },
                { id: 'board', label: 'Department Boards', icon: '📊', title: 'Kanban Workflow Board' },
                { id: 'templates', label: 'Document Templates', icon: '📄', title: 'Official Policy & Form Templates' },
            ];

            // Audit Logs restricted exclusively to higher authorities (Dean, Director, etc.)
            if (isHigherAuthority(currentUser)) {
                navItems.push({ id: 'audit', label: 'Audit Logs', icon: '🕒', title: 'Real-Time Activity Audit Trail (Dean / Director Only)' });
            }

            return (
                <aside className="sidebar no-print">
                    <div>
                        <div className="sidebar-brand">
                            <div className="sidebar-logo-icon"><span>📚</span></div>
                            <span className="sidebar-logo-text">CampusSync</span>
                        </div>

                        <nav className="sidebar-nav">
                            {navItems.map((item) => {
                                const isActive = activeView === item.id;
                                return (
                                    <button
                                        key={item.id}
                                        className={`sidebar-nav-item ${isActive ? 'active' : ''}`}
                                        onClick={() => onSelectView(item.id)}
                                        title={item.title}
                                    >
                                        <span className="sidebar-nav-icon">{item.icon}</span>
                                        <span>{item.label}</span>
                                    </button>
                                );
                            })}
                        </nav>
                    </div>

                    <div className="sidebar-footer">
                        <button
                            className={`sidebar-nav-item ${activeView === 'settings' ? 'active' : ''}`}
                            onClick={() => onSelectView('settings')}
                            title="Faculty & Account Settings"
                        >
                            <span className="sidebar-nav-icon">⚙️</span>
                            <span>Settings</span>
                        </button>

                        {onLogout && (
                            <button
                                className="sidebar-nav-item"
                                onClick={onLogout}
                                title="Sign out of CampusSync and return to the login screen"
                                style={{ color: '#F87171', marginTop: '0.25rem' }}
                            >
                                <span className="sidebar-nav-icon">🚪</span>
                                <span>Sign Out</span>
                            </button>
                        )}
                    </div>
                </aside>
            );
        }

        // 2. Header Bar Component
        function Header({ activeView, users, currentUser, searchQuery, onSearchChange, onSelectUser, onOpenCreateModal, onPrintBoard, onResetDemo, logs, onLogout }) {
            const [showNotifications, setShowNotifications] = React.useState(false);
            const notifRef = React.useRef(null);
            
            const viewTitles = { home: 'Mission Control', board: 'Department Boards', templates: 'Document Templates', audit: 'Audit Logs', settings: 'Settings' };

            React.useEffect(() => {
                function handleClickOutside(event) {
                    if (notifRef.current && !notifRef.current.contains(event.target)) setShowNotifications(false);
                }
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, [notifRef]);

            return (
                <header className="top-header no-print">
                    <div className="header-left">
                        <h1 className="header-page-title">{viewTitles[activeView] || 'Mission Control'}</h1>
                        <span className="term-badge">Fall 2026 Term</span>
                    </div>

                    <div className="header-search-container">
                        <span className="header-search-icon">🔍</span>
                        <input type="text" className="header-search-input" placeholder="Search across CampusSync..." value={searchQuery} onChange={(e) => onSearchChange(e.target.value)} />
                    </div>

                    <div className="header-right">
                        <button className="btn btn-primary" onClick={onOpenCreateModal} title="Propose a new task or inter-departmental request"><span>+ Propose Task</span></button>
                        <button className="header-icon-btn" onClick={onPrintBoard} title="Print summary to serif PDF format"><span>🖨️</span></button>
                        <button className="header-icon-btn" onClick={onResetDemo} title="Reset demo database to seed state"><span>🔄</span></button>
                        
                        <div style={{ position: 'relative' }} ref={notifRef}>
                            <button className="header-icon-btn" title="Notifications" onClick={() => setShowNotifications(!showNotifications)} style={{ position: 'relative' }}>
                                <span>🔔</span>
                                {logs && logs.length > 0 && <span style={{ position: 'absolute', top: '6px', right: '6px', width: '8px', height: '8px', background: '#EF4444', borderRadius: '50%' }} />}
                            </button>
                            {showNotifications && (
                                <div style={{ position: 'absolute', top: '120%', right: '0', width: '320px', background: '#FFFFFF', border: '1px solid #E2E8F0', borderRadius: '12px', boxShadow: '0 10px 25px rgba(0,0,0,0.1)', zIndex: 100, padding: '1rem', display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #F1F5F9', paddingBottom: '0.5rem', marginBottom: '0.5rem' }}>
                                        <h4 style={{ margin: 0, fontSize: '0.9rem', color: '#0F172A' }}>Recent Activity Alerts</h4>
                                        <span style={{ fontSize: '0.75rem', background: '#EFF6FF', color: '#2563EB', padding: '0.2rem 0.5rem', borderRadius: '10px' }}>{logs ? logs.length : 0} New</span>
                                    </div>
                                    <div style={{ maxHeight: '250px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                                        {logs && logs.length > 0 ? logs.slice(0, 6).map((log, index) => (
                                            <div key={index} style={{ fontSize: '0.8rem', display: 'flex', flexDirection: 'column', gap: '0.2rem' }}>
                                                <span style={{ color: '#334155' }}>{log.details}</span>
                                                <span style={{ color: '#94A3B8', fontSize: '0.7rem' }}>{log.timestamp}</span>
                                            </div>
                                        )) : <div style={{ fontSize: '0.8rem', color: '#64748B', textAlign: 'center', padding: '1rem 0' }}>No new notifications.</div>}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="user-dropdown" title="Click to switch between faculty roles to test Granular Targeted Routing">
                            <div className="user-avatar-circle" style={{ backgroundColor: currentUser?.dept_color || '#3B82F6' }}>{currentUser?.avatar_initials || 'RD'}</div>
                            <div className="user-info-text">
                                <span className="user-name-bold">{currentUser?.name || 'Prof. Davis'}</span>
                                <span className="user-role-sub">{currentUser?.role || 'Professor'} — {currentUser?.dept_code || 'CS'}</span>
                            </div>
                            <span style={{ fontSize: '0.75rem', color: '#64748B', marginLeft: '0.2rem' }}>⌄</span>
                            <select className="role-switcher-select-overlay" value={currentUser ? currentUser.id : ''} onChange={(e) => {
                                const selectedId = parseInt(e.target.value, 10);
                                const found = users.find(u => u.id === selectedId);
                                if (found) onSelectUser(found);
                            }}>
                                {users.map(u => <option key={u.id} value={u.id}>Switch Role: {u.name} ({u.role} — {u.dept_code || 'UNIV'})</option>)}
                            </select>
                        </div>

                        {onLogout && (
                            <button 
                                className="btn btn-outline" 
                                onClick={onLogout}
                                title="Sign out of CampusSync and return to the login screen"
                                style={{ padding: '0.45rem 0.85rem', fontSize: '0.82rem', borderColor: '#E2E8F0', color: '#DC2626', display: 'flex', alignItems: 'center', gap: '0.4rem', background: '#FFFFFF' }}
                            >
                                <span>🚪</span>
                                <span>Sign Out</span>
                            </button>
                        )}
                    </div>
                </header>
            );
        }

        // 3. HomeDashboard Component (Reference UI Screenshot)
        function HomeDashboard({ currentUser, tasks, logs, onSelectView, onOpenCreateModal, onOpenTaskDetail }) {
            const [showHelpMenu, setShowHelpMenu] = React.useState(false);
            const overdueCount = tasks.filter(t => t.due_date && new Date(t.due_date) < new Date('2026-07-29')).length || 3;
            const pendingCount = tasks.filter(t => t.column_id === 2 || t.column_id === 3).length || 5;
            const activeProjectsCount = tasks.length || 12;

            const proposedTasks = tasks.filter(t => t.column_id === 1);
            const inReviewTasks = tasks.filter(t => t.column_id === 2 || t.column_id === 3);
            const finalizedTasks = tasks.filter(t => t.column_id === 4);

            const RequestListItem = ({ task }) => (
                <div className="workspace-card" style={{ padding: '1rem 1.5rem', marginBottom: '0.8rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' }} onClick={() => onOpenTaskDetail(task)} title="Click to view full request details">
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                            <span className="dept-tag" style={{ backgroundColor: task.creator_dept_color || '#3B82F6', padding: '0.2rem 0.6rem', fontSize: '0.75rem' }}>{task.creator_dept_code || 'UNIV'}</span>
                            <span style={{ fontWeight: 700, color: '#0F172A', fontSize: '1rem' }}>{task.title}</span>
                        </div>
                        <div style={{ fontSize: '0.85rem', color: '#64748B', display: 'flex', gap: '1rem' }}>
                            <span>👤 {task.creator_name}</span><span>📅 Due: {task.due_date}</span>
                            <span style={{ color: task.column_id === 4 ? '#059669' : task.column_id === 1 ? '#2563EB' : '#D97706', fontWeight: 600 }}>{task.status || (task.column_id === 1 ? 'Proposed' : task.column_id === 4 ? 'Finalized' : 'In Review')}</span>
                        </div>
                    </div>
                    <div className="avatar-stack">
                        <div className="avatar-stack-item" style={{ backgroundColor: task.creator_dept_color || '#3B82F6' }}>{task.creator_avatar || 'CS'}</div>
                        {task.comment_count > 0 && <div className="avatar-stack-item" style={{ backgroundColor: '#94A3B8', fontSize: '0.65rem' }}>+{task.comment_count}</div>}
                    </div>
                </div>
            );

            return (
                <div className="dashboard-container">
                    <div className="dashboard-main">
                        <div className="dashboard-welcome">
                            <h2 className="welcome-title">Welcome back, {currentUser?.name || 'Prof. Davis'}.</h2>
                            <p className="welcome-subtitle">Here is your grouped breakdown of all academic and infrastructure requests.</p>
                        </div>

                        <div className="kpi-cards-row">
                            <div className="kpi-card" onClick={() => onSelectView('board')} style={{ cursor: 'pointer' }}>
                                <div className="kpi-icon-circle kpi-icon-red"><span>!</span></div>
                                <div className="kpi-data-group"><span className="kpi-number">{overdueCount}</span><span className="kpi-label">Overdue Tasks</span></div>
                            </div>
                            <div className="kpi-card" onClick={() => onSelectView('board')} style={{ cursor: 'pointer' }}>
                                <div className="kpi-icon-circle kpi-icon-amber"><span>🕒</span></div>
                                <div className="kpi-data-group"><span className="kpi-number">{pendingCount}</span><span className="kpi-label">Pending My Approval</span></div>
                            </div>
                            <div className="kpi-card" onClick={() => onSelectView('board')} style={{ cursor: 'pointer' }}>
                                <div className="kpi-icon-circle kpi-icon-green"><span>✓</span></div>
                                <div className="kpi-data-group"><span className="kpi-number">{activeProjectsCount}</span><span className="kpi-label">Active Projects</span></div>
                            </div>
                        </div>

                        <div className="workspaces-section">
                            <div className="section-header-bar">
                                <div className="section-title-group"><span className="section-icon" style={{ background: '#EFF6FF', color: '#2563EB', padding: '0.4rem', borderRadius: '8px' }}>💡</span><h3 className="section-title">Proposed Requests</h3></div>
                                <span style={{ fontSize: '0.85rem', color: '#64748B', fontWeight: 600 }}>{proposedTasks.length} active</span>
                            </div>
                            {proposedTasks.length > 0 ? proposedTasks.map(task => <RequestListItem key={task.id} task={task} />) : <div style={{ padding: '2rem', textAlign: 'center', color: '#94A3B8', border: '1px dashed #CBD5E1', borderRadius: '12px' }}>No proposed requests at this time.</div>}
                        </div>

                        <div className="workspaces-section" style={{ marginTop: '2rem' }}>
                            <div className="section-header-bar">
                                <div className="section-title-group"><span className="section-icon" style={{ background: '#FEF3C7', color: '#D97706', padding: '0.4rem', borderRadius: '8px' }}>👀</span><h3 className="section-title">In Review (Department & Dean)</h3></div>
                                <span style={{ fontSize: '0.85rem', color: '#64748B', fontWeight: 600 }}>{inReviewTasks.length} active</span>
                            </div>
                            {inReviewTasks.length > 0 ? inReviewTasks.map(task => <RequestListItem key={task.id} task={task} />) : <div style={{ padding: '2rem', textAlign: 'center', color: '#94A3B8', border: '1px dashed #CBD5E1', borderRadius: '12px' }}>No requests currently under review.</div>}
                        </div>

                        <div className="workspaces-section" style={{ marginTop: '2rem' }}>
                            <div className="section-header-bar">
                                <div className="section-title-group"><span className="section-icon" style={{ background: '#ECFDF5', color: '#059669', padding: '0.4rem', borderRadius: '8px' }}>✅</span><h3 className="section-title">Finalized Requests</h3></div>
                                <span style={{ fontSize: '0.85rem', color: '#64748B', fontWeight: 600 }}>{finalizedTasks.length} active</span>
                            </div>
                            {finalizedTasks.length > 0 ? finalizedTasks.map(task => <RequestListItem key={task.id} task={task} />) : <div style={{ padding: '2rem', textAlign: 'center', color: '#94A3B8', border: '1px dashed #CBD5E1', borderRadius: '12px' }}>No finalized requests yet.</div>}
                        </div>
                    </div>

                    <div className="dashboard-sidebar">
                        <div className="announcement-box">
                            <div className="announcement-header"><span>📢</span><h3>Global Announcements</h3></div>
                            <div className="announcement-card">
                                <h4 className="announcement-title">Fall Budget Proposals Due</h4>

                                <a href="#budget-policy" className="announcement-link" onClick={(e) => { e.preventDefault(); alert("Opening Fall 2026 University Budget Policy Document PDF..."); }}>Read Policy Document →</a>
                            </div>
                        </div>

                        <div className="activity-section">
                            <div className="activity-header"><span>📈</span><h3>Activity Feed</h3></div>
                            <div className="activity-timeline">
                                {logs && logs.length > 0 ? logs.slice(0, 4).map((log, idx) => (
                                    <div key={log.id || idx} className="timeline-item">
                                        <div className="timeline-bubble">
                                            <div className="timeline-text-group"><span className="timeline-action">{log.details}</span><span className="timeline-time">{log.timestamp?.split(' ')[1] || 'Just now'}</span></div>
                                            <div className="timeline-avatar" style={{ backgroundColor: '#8B5CF6' }}>CS</div>
                                        </div>
                                    </div>
                                )) : (
                                    <>
                                        <div className="timeline-item"><div className="timeline-bubble"><div className="timeline-text-group"><span className="timeline-action"><strong>Dr. Hayes</strong> moved a task <span style={{ color: '#2563EB', fontWeight: 600 }}>Thermodynamics Syllabus Draft</span></span><span className="timeline-time">20 mins ago</span></div><div className="timeline-avatar" style={{ backgroundColor: '#3B82F6' }}>DH</div></div></div>
                                        <div className="timeline-item"><div className="timeline-bubble"><div className="timeline-text-group"><span className="timeline-action"><strong>Prof. Smith</strong> left a comment on <span style={{ color: '#2563EB', fontWeight: 600 }}>Update Web Tech Lab Requirements...</span></span><span className="timeline-time">1 hour ago</span></div><div className="timeline-avatar" style={{ backgroundColor: '#10B981' }}>PS</div></div></div>
                                        <div className="timeline-item"><div className="timeline-bubble"><div className="timeline-text-group"><span className="timeline-action"><strong>Dean Elena Miller</strong> signed off on <span style={{ color: '#2563EB', fontWeight: 600 }}>Fall 2026 Exam Schedule</span></span><span className="timeline-time">2 hours ago</span></div><div className="timeline-avatar" style={{ backgroundColor: '#EC4899' }}>EM</div></div></div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>

                    {showHelpMenu && (
                        <div style={{ position: 'fixed', bottom: '80px', right: '40px', width: '320px', background: '#FFFFFF', border: '1px solid #E2E8F0', borderRadius: '12px', boxShadow: '0 10px 25px rgba(0,0,0,0.15)', zIndex: 1000, padding: '1.2rem' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.8rem' }}>
                                <h4 style={{ margin: 0, color: '#0F172A' }}>CampusSync Guide</h4>
                                <button style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '1.2rem', color: '#64748B' }} onClick={() => setShowHelpMenu(false)}>×</button>
                            </div>
                            <ol style={{ paddingLeft: '1.2rem', margin: 0, fontSize: '0.85rem', color: '#334155', display: 'flex', flexDirection: 'column', gap: '0.6rem' }}>
                                <li>Use the top-right <strong>Faculty Role Switcher</strong> to test Granular Access Control.</li>
                                <li>Click <strong>'Department Boards'</strong> in the left sidebar to drag and drop proposals.</li>
                                <li>Click any task card for progressive disclosure of comments and docs.</li>
                            </ol>
                        </div>
                    )}
                    <button className="floating-help-btn no-print" title="CampusSync Faculty Help & Guide" onClick={() => setShowHelpMenu(!showHelpMenu)}>?</button>
                </div>
            );
        }

        // 4. TaskCard Component
        function TaskCard({ task, onDragStart, onClickCard, isSelected, onToggleSelect, onOpenDocument }) {
            const isOverdue = task.due_date && new Date(task.due_date) < new Date('2026-07-29');
            return (
                <div 
                    className={`task-card ${isSelected ? 'task-card-selected' : ''}`}
                    draggable
                    onDragStart={(e) => onDragStart(e, task)}
                    onClick={() => onClickCard(task)}
                    title="Click to view full details, threaded comments, and audit history"
                    style={isSelected ? { borderColor: '#3B82F6', background: '#F0F9FF' } : {}}
                >
                    <div className="task-card-top">
                        <div className="task-tags-group" style={{ display: 'flex', alignItems: 'center', gap: '0.45rem' }}>
                            {onToggleSelect && (
                                <div 
                                    className={`task-select-checkbox ${isSelected ? 'checked' : ''}`}
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        onToggleSelect(task.id);
                                    }}
                                    title={isSelected ? "Deselect proposal" : "Select proposal for batch print"}
                                >
                                    {isSelected ? '✓' : ''}
                                </div>
                            )}
                            <span className="dept-tag" style={{ backgroundColor: task.creator_dept_color || '#3B82F6' }} data-tooltip={task.creator_dept_name || 'Computer Science Department'}>
                                {task.creator_dept_code || 'CS'}
                            </span>
                            {task.target_department_id && (
                                <span className="target-badge" title="Granular Access Control: Only visible to the targeted department, creator, and Deans">
                                    🔒 Target: {task.target_dept_code || 'ACC'}
                                </span>
                            )}
                        </div>
                        <span className="drag-handle" title="Drag and drop to move between board columns">⋮⋮</span>
                    </div>

                    <div className="task-card-title">{task.title}</div>

                    {/* Quick Attached Document Pill */}
                    {task.attachments && task.attachments.length > 0 && (
                        <div 
                            className="task-card-doc-pill"
                            onClick={(e) => {
                                e.stopPropagation();
                                if (onOpenDocument) onOpenDocument(task.attachments[0], task);
                                else onClickCard(task);
                            }}
                            title={`Click to open document: ${task.attachments[0].name}`}
                        >
                            <span>{task.attachments[0].icon || '📎'}</span>
                            <span style={{ fontWeight: 600, maxWidth: '170px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                {task.attachments[0].name}
                            </span>
                            <span style={{ fontSize: '0.68rem', color: '#2563EB', fontWeight: 700 }}>👁️ Open</span>
                        </div>
                    )}

                    <div className="task-card-meta">
                        <div className={`task-due-date ${isOverdue ? 'overdue' : ''}`} title="Target completion date">
                            <span>📅</span>
                            <span>{task.due_date || '2026-08-15'}</span>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                            {task.comment_count > 0 && <span className="comment-counter" title={`${task.comment_count} threaded comments`}>💬 {task.comment_count}</span>}
                            <div className="avatar-badge" style={{ backgroundColor: task.creator_dept_color || '#334155' }} title={`Created by ${task.creator_name} (${task.creator_role})`}>
                                {task.creator_avatar || 'CS'}
                            </div>
                        </div>
                    </div>

                    <div className="status-attribution">
                        <span>Moved by {task.last_moved_by_name || task.creator_name || 'Prof. Davis'}</span>
                        <span style={{ fontSize: '0.68rem', fontWeight: 600 }}>{task.status || 'Proposed'}</span>
                    </div>
                </div>
            );
        }

                

        // 5. Column Component
        function Column({ column, tasks, onDragStart, onDragOver, onDragLeave, onDrop, onClickCard, selectedTaskIds = [], onToggleSelect, onOpenDocument }) {
            const stageDetails = {
                1: { icon: '💡', title: 'Proposed Requests', tag: 'Stage 1', dot: '#3B82F6', desc: 'New submissions' },
                2: { icon: '👀', title: 'Department Review', tag: 'Stage 2', dot: '#F59E0B', desc: 'Faculty evaluation' },
                3: { icon: '⚖️', title: 'Dean Approval', tag: 'Stage 3', dot: '#8B5CF6', desc: 'Executive sign-off' },
                4: { icon: '✅', title: 'Finalized Requests', tag: 'Stage 4', dot: '#10B981', desc: 'Approved & scheduled' }
            };
            const details = stageDetails[column.position_order || column.id] || { icon: '📋', title: column.title, tag: 'Workflow', dot: '#3B82F6', desc: '' };

            return (
                <div className="kanban-column" onDragOver={(e) => onDragOver(e, column.id)} onDragLeave={(e) => onDragLeave(e)} onDrop={(e) => onDrop(e, column.id)}>
                    <div className="column-header">
                        <div className="column-title-group" style={{ display: 'flex', flexDirection: 'column', gap: '0.2rem' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                <span style={{ fontSize: '1rem' }}>{details.icon}</span>
                                <h3 className="column-title">{details.title}</h3>
                            </div>
                            <span style={{ fontSize: '0.72rem', color: '#64748B', fontWeight: 500 }}>{details.desc}</span>
                        </div>
                        <span className="column-count" title="Total tasks in this stage">{tasks.length}</span>
                    </div>
                    <div className="column-task-list">
                        {tasks.length > 0 ? (
                            tasks.map((task) => (
                                <TaskCard 
                                    key={task.id} 
                                    task={task} 
                                    onDragStart={onDragStart} 
                                    onClickCard={onClickCard} 
                                    isSelected={selectedTaskIds.includes(task.id)}
                                    onToggleSelect={onToggleSelect}
                                    onOpenDocument={onOpenDocument}
                                />
                            ))
                        ) : (
                            <div className="empty-drop-zone">Drop {details.title.toLowerCase()} here</div>
                        )}
                    </div>
                </div>
            );
        }

                

        // 6. KanbanBoard Component with Distinct Sections for Proposed, Review, Approve, and Final Requests
        const BOARD_SECTION_CONFIGS = [
            {
                id: 1, key: 'proposed', title: 'Proposed Requests', shortTitle: 'Proposed', icon: '💡',
                color: '#2563EB', bgColor: '#EFF6FF', badgeBg: '#DBEAFE', badgeColor: '#1D4ED8', tag: 'STAGE 1',
                description: 'New curricular changes, lab equipment proposals, and academic initiatives awaiting review.'
            },
            {
                id: 2, key: 'review', title: 'Department Review Requests', shortTitle: 'Review', icon: '👀',
                color: '#D97706', bgColor: '#FEF3C7', badgeBg: '#FDE68A', badgeColor: '#B45309', tag: 'STAGE 2',
                description: 'Proposals currently under active peer discussion and inter-departmental faculty review.'
            },
            {
                id: 3, key: 'approve', title: 'Dean Approval Requests', shortTitle: 'Approve', icon: '⚖️',
                color: '#8B5CF6', bgColor: '#F3E8FF', badgeBg: '#E9D5FF', badgeColor: '#7C3AED', tag: 'STAGE 3',
                description: 'Proposals endorsed by department heads, awaiting formal Dean & Executive sign-off.'
            },
            {
                id: 4, key: 'final', title: 'Finalized Requests', shortTitle: 'Final', icon: '✅',
                color: '#059669', bgColor: '#ECFDF5', badgeBg: '#D1FAE5', badgeColor: '#047857', tag: 'STAGE 4',
                description: 'Formally approved, scheduled, and funded academic term proposals.'
            }
        ];

        function KanbanBoard({ 
            columns, 
            tasks, 
            onDragStart, 
            onDragOver, 
            onDragLeave, 
            onDrop, 
            onClickCard,
            selectedTaskIds = [],
            onToggleSelect,
            onSelectAll,
            onClearSelection,
            onPrintSelected,
            onOpenDocument
        }) {
            const [viewMode, setViewMode] = React.useState('sections'); // 'sections' | 'columns'
            const [activeSectionFilter, setActiveSectionFilter] = React.useState('all');
            const [dragOverSectionId, setDragOverSectionId] = React.useState(null);

            const getTasksForColumn = (columnId) => tasks.filter(t => (t.column_id || 1) === columnId);

            const visibleSections = activeSectionFilter === 'all' 
                ? BOARD_SECTION_CONFIGS 
                : BOARD_SECTION_CONFIGS.filter(s => s.id === activeSectionFilter);

            const handleSectionDragOver = (e, sectionId) => {
                e.preventDefault();
                setDragOverSectionId(sectionId);
                if (onDragOver) onDragOver(e, sectionId);
            };

            const handleSectionDragLeave = (e) => {
                setDragOverSectionId(null);
                if (onDragLeave) onDragLeave(e);
            };

            const handleSectionDrop = (e, sectionId) => {
                e.preventDefault();
                setDragOverSectionId(null);
                if (onDrop) onDrop(e, sectionId);
            };

            const isAllSelected = tasks.length > 0 && selectedTaskIds.length === tasks.length;

            const handleToggleAll = () => {
                if (isAllSelected) {
                    if (onClearSelection) onClearSelection();
                } else {
                    if (onSelectAll) onSelectAll(tasks.map(t => t.id));
                }
            };

            return (
                <div className="board-container">
                    <div className="board-header-bar" style={{ flexWrap: 'wrap', gap: '1rem' }}>
                        <div className="board-info">
                            <h2 className="board-title">University Department Workflow Board</h2>
                            <span className="board-stats-pill">{tasks.length} Active Proposals</span>
                            {selectedTaskIds.length > 0 && (
                                <span className="board-stats-pill" style={{ background: '#EFF6FF', color: '#2563EB', borderColor: '#BFDBFE' }}>
                                    {selectedTaskIds.length} Selected
                                </span>
                            )}
                        </div>

                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', flexWrap: 'wrap' }}>
                            {/* Batch Selection & Print Buttons */}
                            {onToggleSelect && tasks.length > 0 && (
                                <button
                                    type="button"
                                    className="btn btn-outline"
                                    style={{ padding: '0.35rem 0.75rem', fontSize: '0.82rem' }}
                                    onClick={handleToggleAll}
                                >
                                    <span>{isAllSelected ? 'Deselect All' : 'Select All'}</span>
                                </button>
                            )}

                            {selectedTaskIds.length > 0 && onPrintSelected && (
                                <button
                                    type="button"
                                    className="btn btn-primary"
                                    style={{ padding: '0.35rem 0.85rem', fontSize: '0.82rem', background: '#2563EB', borderColor: '#3B82F6' }}
                                    onClick={onPrintSelected}
                                    title="Print detailed view of all selected requests"
                                >
                                    <span>🖨️ Print Selected ({selectedTaskIds.length})</span>
                                </button>
                            )}

                            <div style={{ display: 'flex', background: '#F1F5F9', padding: '0.25rem', borderRadius: '8px', border: '1px solid #E2E8F0' }}>
                                <button
                                    type="button"
                                    className={`btn ${viewMode === 'sections' ? 'btn-primary' : ''}`}
                                    style={{ 
                                        padding: '0.35rem 0.75rem', 
                                        fontSize: '0.82rem',
                                        background: viewMode === 'sections' ? '#0F172A' : 'transparent',
                                        color: viewMode === 'sections' ? '#FFFFFF' : '#475569',
                                        border: 'none',
                                        borderRadius: '6px'
                                    }}
                                    onClick={() => setViewMode('sections')}
                                    title="View proposals in distinct horizontal sections"
                                >
                                    📑 Distinct Sections
                                </button>
                                <button
                                    type="button"
                                    className={`btn ${viewMode === 'columns' ? 'btn-primary' : ''}`}
                                    style={{ 
                                        padding: '0.35rem 0.75rem', 
                                        fontSize: '0.82rem',
                                        background: viewMode === 'columns' ? '#0F172A' : 'transparent',
                                        color: viewMode === 'columns' ? '#FFFFFF' : '#475569',
                                        border: 'none',
                                        borderRadius: '6px'
                                    }}
                                    onClick={() => setViewMode('columns')}
                                    title="View proposals in side-by-side 4 columns"
                                >
                                    📊 4-Column Board
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Section Filter Navigation Pills */}
                    <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1.5rem', overflowX: 'auto', paddingBottom: '0.4rem', borderBottom: '1px solid #E2E8F0' }}>
                        <button
                            type="button"
                            style={{
                                padding: '0.45rem 0.9rem', fontSize: '0.82rem', fontWeight: 600, borderRadius: '20px',
                                border: '1px solid', borderColor: activeSectionFilter === 'all' ? '#0F172A' : '#E2E8F0',
                                background: activeSectionFilter === 'all' ? '#0F172A' : '#FFFFFF',
                                color: activeSectionFilter === 'all' ? '#FFFFFF' : '#64748B', cursor: 'pointer',
                                display: 'flex', alignItems: 'center', gap: '0.4rem', transition: 'all 0.15s ease'
                            }}
                            onClick={() => setActiveSectionFilter('all')}
                        >
                            <span>All Stages</span>
                            <span style={{ background: activeSectionFilter === 'all' ? 'rgba(255,255,255,0.2)' : '#F1F5F9', padding: '0.1rem 0.45rem', borderRadius: '10px', fontSize: '0.72rem' }}>
                                {tasks.length}
                            </span>
                        </button>

                        {BOARD_SECTION_CONFIGS.map(section => {
                            const count = getTasksForColumn(section.id).length;
                            const isActive = activeSectionFilter === section.id;
                            return (
                                <button
                                    key={section.id}
                                    type="button"
                                    style={{
                                        padding: '0.45rem 0.9rem', fontSize: '0.82rem', fontWeight: 600, borderRadius: '20px',
                                        border: '1px solid', borderColor: isActive ? section.color : '#E2E8F0',
                                        background: isActive ? section.bgColor : '#FFFFFF',
                                        color: isActive ? section.color : '#64748B', cursor: 'pointer',
                                        display: 'flex', alignItems: 'center', gap: '0.45rem', transition: 'all 0.15s ease'
                                    }}
                                    onClick={() => setActiveSectionFilter(section.id)}
                                >
                                    <span>{section.icon}</span>
                                    <span>{section.shortTitle}</span>
                                    <span style={{ 
                                        background: isActive ? section.badgeBg : '#F1F5F9',
                                        color: isActive ? section.badgeColor : '#64748B',
                                        padding: '0.1rem 0.45rem', borderRadius: '10px', fontSize: '0.72rem', fontWeight: 700 
                                    }}>
                                        {count}
                                    </span>
                                </button>
                            );
                        })}
                    </div>

                    {/* MODE 1: DISTINCT GROUPED SECTIONS VIEW */}
                    {viewMode === 'sections' && (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '2rem' }}>
                            {visibleSections.map(section => {
                                const sectionTasks = getTasksForColumn(section.id);
                                const isDragOver = dragOverSectionId === section.id;

                                return (
                                    <div 
                                        key={section.id}
                                        className="workspaces-section"
                                        style={{
                                            border: isDragOver ? `2px dashed ${section.color}` : '1px solid #E2E8F0',
                                            borderRadius: '16px',
                                            padding: '1.25rem 1.5rem',
                                            background: isDragOver ? section.bgColor : '#FFFFFF',
                                            boxShadow: '0 1px 3px rgba(0,0,0,0.05)',
                                            transition: 'all 0.2s ease'
                                        }}
                                        onDragOver={(e) => handleSectionDragOver(e, section.id)}
                                        onDragLeave={handleSectionDragLeave}
                                        onDrop={(e) => handleSectionDrop(e, section.id)}
                                    >
                                        <div className="section-header-bar" style={{ marginBottom: '1rem' }}>
                                             <div className="section-title-group" style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                                                <span className="section-icon" style={{ background: section.bgColor, color: section.color, padding: '0.5rem', borderRadius: '10px', fontSize: '1.25rem' }}>
                                                    {section.icon}
                                                </span>
                                                <div>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                                                        <h3 className="section-title" style={{ margin: 0, fontSize: '1.15rem' }}>{section.title}</h3>
                                                        <span style={{ background: section.badgeBg, color: section.badgeColor, padding: '0.15rem 0.5rem', borderRadius: '6px', fontSize: '0.7rem', fontWeight: 700 }}>
                                                            {section.tag}
                                                        </span>
                                                    </div>
                                                    <p style={{ margin: '0.2rem 0 0 0', fontSize: '0.82rem', color: '#64748B' }}>{section.description}</p>
                                                </div>
                                            </div>
                                            <span style={{ fontSize: '0.85rem', color: section.color, fontWeight: 700, background: section.bgColor, padding: '0.3rem 0.75rem', borderRadius: '20px' }}>
                                                {sectionTasks.length} {sectionTasks.length === 1 ? 'proposal' : 'proposals'}
                                            </span>
                                        </div>

                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                                            {sectionTasks.length > 0 ? (
                                                sectionTasks.map(task => (
                                                    <div 
                                                        key={task.id}
                                                        className="workspace-card"
                                                        draggable
                                                        onDragStart={(e) => onDragStart(e, task)}
                                                        onClick={() => onClickCard(task)}
                                                        style={{ 
                                                            padding: '1.1rem 1.4rem', marginBottom: '0', display: 'flex',
                                                            justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer',
                                                            borderLeft: `4px solid ${section.color}`,
                                                            transition: 'transform 0.15s ease, box-shadow 0.15s ease'
                                                        }}
                                                        title="Click to view details & discussion. Drag to advance stage."
                                                    >
                                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.45rem', flex: 1, paddingRight: '1.5rem' }}>
                                                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', flexWrap: 'wrap' }}>
                                                                {onToggleSelect && (
                                                                    <div 
                                                                        className={`task-select-checkbox ${selectedTaskIds.includes(task.id) ? 'checked' : ''}`}
                                                                        onClick={(e) => {
                                                                            e.stopPropagation();
                                                                            onToggleSelect(task.id);
                                                                        }}
                                                                        title={selectedTaskIds.includes(task.id) ? "Deselect proposal" : "Select proposal for batch print"}
                                                                    >
                                                                        {selectedTaskIds.includes(task.id) ? '✓' : ''}
                                                                    </div>
                                                                )}
                                                                <span className="dept-tag" style={{ backgroundColor: task.creator_dept_color || '#3B82F6', padding: '0.2rem 0.6rem', fontSize: '0.75rem' }}>
                                                                    {task.creator_dept_code || 'UNIV'}
                                                                </span>
                                                                <span style={{ fontWeight: 700, color: '#0F172A', fontSize: '1.02rem' }}>{task.title}</span>
                                                                {task.target_department_id && (
                                                                    <span style={{ fontSize: '0.7rem', background: '#FEF3C7', color: '#B45309', padding: '0.15rem 0.45rem', borderRadius: '4px', fontWeight: 600 }}>
                                                                        🔒 Routed to {task.target_dept_code || 'Accounts'}
                                                                    </span>
                                                                )}
                                                            </div>
                                                            {task.description && (
                                                                <p style={{ margin: 0, fontSize: '0.85rem', color: '#475569', lineHeight: '1.4' }}>
                                                                    {task.description.length > 140 ? task.description.substring(0, 140) + '...' : task.description}
                                                                </p>
                                                            )}
                                                            <div style={{ fontSize: '0.8rem', color: '#64748B', display: 'flex', gap: '1.2rem', alignItems: 'center', marginTop: '0.2rem' }}>
                                                                <span>👤 {task.creator_name} ({task.creator_role})</span>
                                                                <span>📅 Due: {task.due_date || '2026-08-15'}</span>
                                                                {task.last_moved_by_name && (
                                                                    <span style={{ fontStyle: 'italic', color: '#94A3B8' }}>Moved by {task.last_moved_by_name}</span>
                                                                )}
                                                            </div>
                                                        </div>
                                                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                                                            {/* Quick Open Document Button */}
                                                            <button
                                                                type="button"
                                                                className="btn btn-outline"
                                                                style={{
                                                                    padding: '0.35rem 0.75rem',
                                                                    fontSize: '0.76rem',
                                                                    display: 'inline-flex',
                                                                    alignItems: 'center',
                                                                    gap: '0.4rem',
                                                                    color: '#1D4ED8',
                                                                    borderColor: '#BFDBFE',
                                                                    background: '#EFF6FF',
                                                                    fontWeight: 600,
                                                                    borderRadius: '6px'
                                                                }}
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    const docToOpen = (task.attachments && task.attachments.length > 0)
                                                                        ? task.attachments[0]
                                                                        : { id: 'brief_' + task.id, name: 'Proposal_Brief_' + task.id + '.pdf', size: '245 KB', type: 'application/pdf', icon: '📕' };
                                                                    if (onOpenDocument) onOpenDocument(docToOpen, task);
                                                                }}
                                                                title="Open, read, and inspect the attached proposal specification document"
                                                            >
                                                                <span>📄 Read Document</span>
                                                            </button>

                                                            {task.comment_count > 0 && (
                                                                <span style={{ fontSize: '0.8rem', color: '#64748B', display: 'flex', alignItems: 'center', gap: '0.3rem', background: '#F1F5F9', padding: '0.25rem 0.6rem', borderRadius: '12px' }}>
                                                                    💬 {task.comment_count}
                                                                </span>
                                                            )}

            );

        // 7. TemplateLibraryView Component

                    { id: 'att_1b', name: 'Course_Learning_Outcomes_Rubric.docx', size: '420 KB', type: 'application/docx', icon: '📝' }

                description: 'Routing slip for external research grant applications requiring Department Head and Dean approval before submission with compliance guidelines.',
                draftTitle: 'Grant Application: [Funding Agency]', draftDescription: 'Principal Investigator: [Name]\nFunding Agency: [Agency Name]\nDeadline: [Date]\n\nAbstract:\n[Brief summary of the research proposal]',
                attachments: [
                    { id: 'att_3a', name: 'External_Grant_Routing_Procedure.pdf', size: '1.2 MB', type: 'application/pdf', icon: '📕' },
                    { id: 'att_3b', name: 'Institutional_Endorsement_Form.docx', size: '310 KB', type: 'application/docx', icon: '📝' }

                description: 'Formal request for sabbatical, medical, or personal leave. Includes coverage plan requirements and university policy handbook.',
                draftTitle: 'Leave Request: [Faculty Name]', draftDescription: 'Leave Type: [Sabbatical/Medical/Personal]\nDates: [Start Date] to [End Date]\n\nTeaching Coverage Plan:\n[How will your courses be covered?]',
                attachments: [
                    { id: 'att_4a', name: 'Faculty_Handbook_Leave_Policy.pdf', size: '950 KB', type: 'application/pdf', icon: '📕' },
                    { id: 'att_4b', name: 'Teaching_Coverage_Plan_Form.docx', size: '260 KB', type: 'application/docx', icon: '📝' }
                ]
            }
        ];

        const PRESET_ICONS = ['📚', '🖥️', '💰', '✈️', '📋', '🔬', '🏛️', '📊', '🛡️', '⚙️', '🎓', '📝'];
        const PRESET_CATEGORIES = [
            'Academic & Curriculum',
            'Operations & IT',
            'Research & Funding',
            'Human Resources',
            'Student Affairs',
            'Facilities & Infrastructure',
            'General Administrative'
        ];

        function TemplateLibraryView({ onUseTemplate }) {
            const fileInputRef = React.useRef(null);
            const [templates, setTemplates] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('campussync_document_templates');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            return parsed.map(t => ({
                                ...t,
                                attachments: Array.isArray(t.attachments) ? t.attachments : []
                            }));
                        }
                    }
                } catch (e) {}
                return DEFAULT_TEMPLATES;
            });

            const [editingTemplate, setEditingTemplate] = React.useState(null);
            const [formData, setFormData] = React.useState({
                title: '',
                category: 'Academic & Curriculum',
                icon: '📋',
                description: '',
                draftTitle: '',
                draftDescription: '',
                attachments: []
            });

            const saveTemplates = (newTemplates) => {
                setTemplates(newTemplates);
                try {
                    localStorage.setItem('campussync_document_templates', JSON.stringify(newTemplates));
                } catch (e) {}
            };

            const handleOpenAdd = () => {
                setFormData({
                    title: '',
                    category: 'Academic & Curriculum',
                    icon: '📋',
                    description: '',
                    draftTitle: '',
                    draftDescription: '',
                    attachments: []
                });
                setEditingTemplate({ isNew: true });
            };

            const handleOpenEdit = (template) => {
                setFormData({
                    title: template.title || '',
                    category: template.category || 'Academic & Curriculum',
                    icon: template.icon || '📋',
                    description: template.description || '',
                    draftTitle: template.draftTitle || '',
                    draftDescription: template.draftDescription || '',
                    attachments: Array.isArray(template.attachments) ? [...template.attachments] : []
                });
                setEditingTemplate(template);
            };

            const handleDelete = (templateId) => {
                if (window.confirm("Are you sure you want to delete this template?")) {
                    const updated = templates.filter(t => t.id !== templateId);
                    saveTemplates(updated);
                }
            };

            const handleResetDefaults = () => {
                if (window.confirm("Reset all templates back to standard university defaults with official PDF specifications? Any custom templates will be replaced.")) {
                    saveTemplates(DEFAULT_TEMPLATES);
                }
            };

            const handleFileSelect = (e) => {
                const files = Array.from(e.target.files || []);
                if (files.length === 0) return;

                const newAttachments = files.map(file => {
                    let icon = '📄';
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (['xls', 'xlsx', 'csv'].includes(ext)) icon = '📊';
                    else if (['doc', 'docx'].includes(ext)) icon = '📝';
                    else if (['ppt', 'pptx'].includes(ext)) icon = '📽️';
                    else if (['pdf'].includes(ext)) icon = '📕';

                    const sizeKB = Math.round(file.size / 1024);
                    const sizeStr = sizeKB > 1024 ? (sizeKB / 1024).toFixed(1) + ' MB' : sizeKB + ' KB';

                    let blobUrl = null;
                    try {
                        blobUrl = URL.createObjectURL(file);
                    } catch (err) {}

                    return {
                        id: 'file_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                        name: file.name,
                        size: sizeStr,
                        type: file.type || 'application/octet-stream',
                        icon: icon,
                        url: blobUrl
                    };
                });

                setFormData(prev => ({
                    ...prev,
                    attachments: [...(prev.attachments || []), ...newAttachments]
                }));

                if (e.target) e.target.value = '';
            };

            const addQuickPreset = (presetName, presetSize, presetIcon) => {
                setFormData(prev => ({
                    ...prev,
                    attachments: [
                        ...(prev.attachments || []),
                        {
                            id: 'preset_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                            name: presetName,
                            size: presetSize,
                            type: 'application/pdf',
                            icon: presetIcon
                        }
                    ]
                }));
            };

            const handleRemoveAttachment = (attId) => {
                setFormData(prev => ({
                    ...prev,
                    attachments: (prev.attachments || []).filter(a => a.id !== attId)
                }));
            };

            const handleDownloadFile = (att) => {
                if (att.url) {
                    const a = document.createElement('a');
                    a.href = att.url;
                    a.download = att.name;
                    a.target = '_blank';
                    a.click();
                } else {
                    const content = `========================================================================\n` +
                        `UNIVERSITY ACADEMIC & FACULTY AFFAIRS COUNCIL\n` +
                        `OFFICIAL POLICY SPECIFICATION / TEMPLATE GUIDELINES\n` +
                        `========================================================================\n\n` +
                        `Document Title: ${att.name}\n` +
                        `Specification Size: ${att.size}\n` +
                        `Academic Term: Fall 2026 Term\n\n` +
                        `Overview:\n` +
                        `This official template specification document provides compliance guidance,\n` +
                        `accreditation standards, and resource estimation parameters for university faculty\n` +
                        `submitting proposals through CampusSync.\n\n` +
                        `Certified by the Dean of Academic Affairs.\n` +
                        `========================================================================\n`;
                    
                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = att.name.replace(/\.[^/.]+$/, "") + "_Official_Spec.txt";
                    a.click();
                    URL.revokeObjectURL(url);
                }
            };

            const handleFormSubmit = (e) => {
                e.preventDefault();
                if (!formData.title.trim()) {
                    alert("Please provide a template title.");
                    return;
                }

                if (editingTemplate.isNew) {
                    const newT = {
                        ...formData,
                        id: 't_' + Date.now(),
                        title: formData.title.trim(),
                        draftTitle: formData.draftTitle.trim() || formData.title.trim(),
                        draftDescription: formData.draftDescription.trim() || formData.description.trim(),
                        attachments: formData.attachments || []
                    };
                    saveTemplates([...templates, newT]);
                } else {
                    const updated = templates.map(t => {
                        if (t.id === editingTemplate.id) {
                            return {
                                ...t,
                                ...formData,
                                title: formData.title.trim(),
                                draftTitle: formData.draftTitle.trim() || formData.title.trim(),
                                draftDescription: formData.draftDescription.trim() || formData.description.trim(),
                                attachments: formData.attachments || []
                            };
                        }
                        return t;
                    });
                    saveTemplates(updated);
                }

                setEditingTemplate(null);
            };

            return (
                <div className="dashboard-container" style={{ gridTemplateColumns: '1fr' }}>
                    <div className="dashboard-main">

                            <div className="section-title-group">
                                <span style={{ fontSize: '1.4rem' }}>📄</span>
                                <div>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                                        <h2 className="welcome-title">Official Document & Policy Templates</h2>

                                </div>
                            </div>
                            <div style={{ display: 'flex', gap: '0.6rem' }}>
                                <button className="btn btn-outline" onClick={handleResetDefaults} title="Reset all templates back to university defaults with PDF specs">
                                    <span>🔄 Reset Defaults</span>
                                </button>
                                <button className="btn btn-primary" onClick={handleOpenAdd} title="Create a new official template with PDF or form attachments">
                                    <span>+ Add Template</span>
                                </button>
                            </div>
                        </div>

                        <div className="workspace-card">
                            {templates.length === 0 ? (
                                <div style={{ padding: '3rem', textAlign: 'center', color: '#64748B' }}>
                                    <span style={{ fontSize: '3rem' }}>📂</span>
                                    <h3 style={{ marginTop: '1rem', color: '#0F172A' }}>No Templates Available</h3>
                                    <p style={{ margin: '0.5rem 0 1.5rem' }}>Create a new document template or reset to standard university defaults.</p>
                                    <div style={{ display: 'flex', gap: '0.75rem', justifyContent: 'center' }}>
                                        <button className="btn btn-primary" onClick={handleOpenAdd}>+ Add Template</button>
                                        <button className="btn btn-outline" onClick={handleResetDefaults}>Reset Defaults</button>
                                    </div>
                                </div>
                            ) : (
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(340px, 1fr))', gap: '1.5rem', marginTop: '0.5rem' }}>
                                    {templates.map(template => {
                                        const templateAttachments = template.attachments || [];
                                        return (
                                            <div key={template.id} style={{ border: '1px solid #E2E8F0', borderRadius: '12px', padding: '1.4rem', display: 'flex', flexDirection: 'column', gap: '0.85rem', background: '#F8FAFC', position: 'relative' }}>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                                                        <span style={{ fontSize: '2rem' }}>{template.icon || '📄'}</span>
                                                        <div>
                                                            <h4 style={{ margin: 0, color: '#0F172A', fontSize: '1.05rem', fontWeight: 700, lineHeight: '1.3' }}>{template.title}</h4>
                                                            <span style={{ fontSize: '0.72rem', color: '#64748B', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em' }}>{template.category}</span>
                                                        </div>
                                                    </div>
                                                    <div style={{ display: 'flex', gap: '0.35rem' }}>
                                                        <button className="btn btn-outline" style={{ padding: '0.3rem 0.6rem', fontSize: '0.75rem' }} onClick={() => handleOpenEdit(template)} title="Edit template fields & attachments">✏️ Edit</button>
                                                        <button className="btn btn-outline" style={{ padding: '0.3rem 0.5rem', fontSize: '0.75rem', color: '#EF4444', borderColor: '#FCA5A5' }} onClick={() => handleDelete(template.id)} title="Delete template">🗑️</button>
                                                    </div>
                                                </div>
                                                <p style={{ margin: 0, fontSize: '0.85rem', color: '#475569', lineHeight: '1.5' }}>{template.description}</p>

                                                </div>

                                                {/* Attached Reference Documents & Specs Section */}
                                                <div style={{ marginTop: '0.25rem' }}>
